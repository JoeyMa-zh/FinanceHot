# Render 零费用部署蓝图（免费 Web Service + 外部 Neon Postgres，均不绑卡）。
# https://dashboard.render.com 选 New → Blueprint，连接本仓库。
# 创建前面板会提示填写 sync:false 的密钥（ADMIN_PASSWORD / DATABASE_URL / LLM_API_KEY / LLM_MODEL）。
# DATABASE_URL：到 https://neon.tech 用 GitHub 登录建免费项目，复制 pooled connection string 填入。

services:
  - type: web
    name: fi-hot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w @aihot/web
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://fi-hot.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: IMG_PROXY_SIGN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COLLECT_ENABLED
        value: "true"
      - key: MODEL_CALLS_ENABLED
        value: "true"
      - key: LLM_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
