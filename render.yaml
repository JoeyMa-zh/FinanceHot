# Render 零费用部署蓝图（免费 Web Service + 外部 Neon Postgres，均不绑卡）。
# https://dashboard.render.com 选 New → Blueprint，连接本仓库。
# 创建前面板会提示填写 sync:false 的密钥（ADMIN_PASSWORD / DATABASE_URL / LLM_API_KEY / LLM_MODEL）。
# DATABASE_URL：到 https://neon.tech 用 GitHub 登录建免费项目，复制 pooled connection string 填入。

services:
  - type: web
    name: fi-hot
    runtime: node
    plan: free
    region: ohio
    # react-router CLI 与 vite 在 devDependencies，构建需要它们，生产安装要显式带上
  buildCommand: npm ci --include=dev && npm run build -w @aihot/web
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://fi-hot.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: IMG_PROXY_SIGN_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COLLECT_ENABLED
        value: "true"
      - key: MODEL_CALLS_ENABLED
        value: "true"
      - key: LLM_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      # 经济日历（modules/market-today）：开启每小时导入 ForexFactory 免费日历数据
      - key: MARKET_TODAY_CALENDAR_ENABLED
        value: "true"
      # 今日市场行情快照（免费公开接口，每 5 分钟）
      - key: MARKET_TODAY_QUOTES_ENABLED
        value: "true"
      # 方向信号判读（modules/direction，影子模式只入库）：不配 key 则模块空闲
      - key: TYPESAFE_BASE_URL
        value: https://api.typesafe.ai/v1
      - key: TYPESAFE_API_KEY
        sync: false
